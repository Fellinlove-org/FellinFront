<app-header [nombre_usuario]="nombre_usuario" [userType]="userType" [cedula]="cedula"></app-header>

<div class="container">
    <div class="form-container">
        <h2 class="form-title">Agregar mascota</h2>

        <form id="form-mascota" class="forma-mascota" (ngSubmit)="addMascota()">
            <div>
                <label for="nombre">✜ Nombre</label>
                <input type="text" id="nombre-mascota" class="form-control" name="nombre" [(ngModel)]="formMascota.nombre">
            </div>

            <div>
                <label for="raza">✜ Raza</label>
                <input type="text" id="raza-mascota" class="form-control" name="raza" [(ngModel)]="formMascota.raza">
            </div>

            <div>
                <label for="edad">✜ Edad</label>
                <input type="number" id="edad-mascota" class="form-control" name="edad" [(ngModel)]="formMascota.edad">
            </div>

            <div>
                <label for="peso">✜ Peso</label>
                <input type="number" id="peso-mascota" class="form-control" name="peso" [(ngModel)]="formMascota.peso">
            </div>

            <div>
                <label for="enfermedad">✜ Enfermedad</label>
                <input type="text" id="enfermedad-mascota" class="form-control" name="enfermedad" [(ngModel)]="formMascota.enfermedad">
            </div>

            <div>
                <label for="foto">✜ Foto</label>
                <input type="text" id="foto-mascota" class="form-control" name="foto" [(ngModel)]="formMascota.foto">
            </div>

            <div class="ultimo">
                <label for="cliente">✜ Cliente</label>
                <select id="cliente" class="form-control" name="cliente" [(ngModel)]="cliente">
                    <option id="cliente-option" *ngFor="let cliente of clientes" [ngValue]="cliente">{{ cliente.nombre }}</option>
                </select>
                <button id="btn-submit-mascota" type="submit" class="btn btn-submit">Enviar</button>
            </div>
        </form>
    </div>
</div>

<div class="button-container-bottom">
    <button [routerLink]="['/mascotas/' + cedula]" class="btn btn-primary">Volver</button>
</div>
