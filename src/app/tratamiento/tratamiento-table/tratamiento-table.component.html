<app-header [nombre_usuario] = "nombre_usuario" [userType]="userType" [cedula]="cedula"></app-header>
<br><br><br><br><br>

<div class="button-container">
  <a class="ButtonVA" [routerLink]="['/tratamiento', cedula, 'add']">Agregar</a>
  <a class="ButtonVA" routerLink="/" th:text="Volver">Volver</a>
</div>
  
  <table class="table table-striped table-bordered border-primaryx" style="width: 80%; margin: 0 auto; text-align: center;">
  
      <thead class="table-dark">
          <tr>
              <th>Id</th>
              <th>Veterinario</th>
              <th>Mascota</th>
              <th>Droga</th>
              <th>Cantidad</th>
              <th>Fecha del Tratamiento</th>
              <th>Options</th>
          </tr>
      </thead>
      <tbody>
        <br>
          <br>
          <tr *ngFor="let tratamiento of tratamientoList">
              <td> {{tratamiento.id}}</td>
              <td> {{tratamiento.veterinario?.nombre}}</td>
              <td> {{tratamiento.mascota?.nombre}}</td>
              <td> {{tratamiento.droga?.nombre}}</td>
              <td> {{tratamiento.cantidad}}</td>
              <td> {{tratamiento.fechaConsulta}}</td>
  
              <ng-container *ngIf=" this.userType== 'veterinario'">
              <td>
              <a (click)=" modificarTratamiento(tratamiento)" class="options-link">
                <img src="https://cdn-icons-png.flaticon.com/128/45/45406.png" width="40px" class="option-icon" alt="Editar">
              </a>
            
            </ng-container>
  
            <ng-container *ngIf=" this.userType== 'administrador'">
              <td>
              <a (click)=" modificarTratamiento(tratamiento)" class="options-link">
                <img src="https://cdn-icons-png.flaticon.com/128/45/45406.png" width="40px" class="option-icon" alt="Editar">
              </a>
             </td>
            </ng-container>
          </tr>
      </tbody>
  </table>
